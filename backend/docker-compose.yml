services:
  api:
    build: .
    env_file: .env
    ports: ["8000:8000"]
    depends_on: [db]
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: vocal_biomarkers
      POSTGRES_USER: vocal
      POSTGRES_PASSWORD: vocal
    ports: ["5432:5432"]
    volumes: [postgres-data:/var/lib/postgresql/data]
volumes:
  postgres-data:
