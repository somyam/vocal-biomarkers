services:
  api:
    build: .
    env_file: .env
    ports: ["8000:8000"]
    depends_on:
      db:
        condition: service_healthy
  ngrok:
    image: ngrok/ngrok:latest
    profiles: [webhooks]
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:-}
    command: ["http", "api:8000", "--url=${WEBHOOK_BASE_URL:-https://configure-ngrok.invalid}", "--config=/etc/ngrok.yml", "--traffic-policy-file=/etc/webhook-policy.yml"]
    ports: ["127.0.0.1:4040:4040"]
    volumes:
      - ./ngrok.yml:/etc/ngrok.yml:ro
      - ./ngrok-traffic-policy.yml:/etc/webhook-policy.yml:ro
    depends_on: [api]
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: vocal_biomarkers
      POSTGRES_USER: vocal
      POSTGRES_PASSWORD: vocal
    ports: ["5433:5432"]
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vocal -d vocal_biomarkers"]
      interval: 2s
      timeout: 3s
      retries: 15
volumes:
  postgres-data:
